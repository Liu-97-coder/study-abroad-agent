name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pyyaml

      - name: 灌知识库（测试需要）
        run: python scripts/ingest_seed.py

      - name: 单元 + 接口测试（强制 mock，不花钱）
        run: python -m pytest -q

      - name: 端到端业务链路（12 项断言）
        run: python scripts/smoke_test.py

      - name: 部署资产自检（Dockerfile / compose / healthcheck）
        run: python -m pytest tests/test_deploy.py -q

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ai_agent_core scripts --select E9,F63,F7,F82
