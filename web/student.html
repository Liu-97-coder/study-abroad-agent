<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>我的申请进度</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body.student { background: #f4f6fb; }
    .s-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
    .s-head {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff; border-radius: 18px; padding: 20px;
      box-shadow: 0 16px 40px -20px rgba(37, 99, 235, .8);
    }
    .s-head h1 { font-size: 20px; margin: 0 0 4px; }
    .s-head p { font-size: 12.5px; opacity: .85; margin: 0; }
    .s-stage {
      display: inline-block; margin-top: 12px; padding: 4px 12px;
      background: rgba(255, 255, 255, .18); border-radius: 999px; font-size: 12.5px;
    }
    .s-card {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; margin-top: 14px; box-shadow: var(--shadow);
    }
    .s-card h2 { font-size: 14px; margin: 0 0 12px; display: flex; justify-content: space-between; }
    .s-card h2 span { color: var(--muted); font-weight: 400; font-size: 12px; }

    .s-steps { display: flex; gap: 6px; margin-top: 14px; }
    .s-step {
      flex: 1; text-align: center; font-size: 10.5px; color: var(--muted);
    }
    .s-step .bar {
      height: 5px; border-radius: 999px; background: #e2e8f0; margin-bottom: 5px;
    }
    .s-step.done .bar { background: var(--primary); }
    .s-step.done { color: var(--primary); font-weight: 600; }

    .s-notice {
      background: var(--primary-soft); color: #1e3a8a; border-left: 3px solid var(--primary);
      padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 12.5px; margin-bottom: 8px;
    }
    .s-tip { font-size: 11.5px; color: var(--muted); margin: 0 0 12px; }

    .s-item {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      margin-bottom: 10px; background: #fbfcfe;
    }
    .s-item .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .s-item .name { font-weight: 600; font-size: 13.5px; }
    .s-item .std { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .s-item .due { color: var(--warn); font-size: 11.5px; margin-top: 4px; }
    .s-item.uploaded { border-color: #bbf7d0; background: var(--ok-soft); }
    .s-item.rejected { border-color: #fecaca; background: var(--danger-soft); }

    .s-upload {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--primary); color: #fff; border-radius: 9px;
      padding: 6px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    }
    .s-upload input { display: none; }
    .s-upload.busy { opacity: .6; pointer-events: none; }

    .s-result { margin-top: 8px; font-size: 12px; }
    .s-result .risk { color: var(--danger); }
    .s-result .fix { color: var(--muted); }
    .s-foot { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 22px; line-height: 1.8; }
    .s-empty { color: var(--muted); font-size: 12.5px; padding: 8px 0; }
  </style>
</head>
<body class="student">
<div class="s-wrap">
  <header class="s-head">
    <h1 id="sName">加载中…</h1>
    <p id="sTarget"></p>
    <div class="s-stage" id="sStage">—</div>
  </header>

  <div class="s-steps" id="sProgress"></div>

  <section class="s-card">
    <h2>需要你提交的材料 <span id="sMissing"></span></h2>
    <div class="s-notice" id="sNotice">加载中…</div>
    <p class="s-tip">支持拍照或上传：图片（jpg/png）、PDF、txt。带红章的扫描件识别率最高。</p>
    <div id="sMaterials"><div class="s-empty">加载中…</div></div>
  </section>

  <section class="s-card">
    <h2>已上传 <span id="sUploadedCount"></span></h2>
    <div id="sUploaded"><div class="s-empty">还没有上传记录</div></div>
  </section>

  <p class="s-foot">
    本页只展示你本人的材料与进度，顾问可以看到完整的申请档案。<br />
    有疑问请直接联系你的顾问，不要相信任何"保录取"承诺。
  </p>
</div>
<div class="toast" id="sToast"></div>
<script src="/static/student.js"></script>
</body>
</html>
